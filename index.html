<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معرضُ الهوياتِ البصرية — حيدر المعاتيق</title>
<meta name="description" content="أعمالُ حيدر المعاتيق في الهويةِ البصرية: شعاراتٌ وأنظمةُ ألوانٍ وخطوطٌ وتطبيقاتُ براندٍ كاملة.">
<meta name="theme-color" content="#0A3428">
<meta property="og:type" content="website">
<meta property="og:title" content="معرضُ الهوياتِ البصرية — حيدر المعاتيق">
<meta property="og:description" content="شعاراتٌ وأنظمةُ هويةٍ كاملةٌ للعلاماتِ والمؤسسات.">
<meta property="og:url" content="https://haydarvsky.github.io/brand/">
<meta property="og:image" content="https://haydarvsky.github.io/img/share.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/logo-cream.svg">
<link rel="preload" href="fonts/sakkal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/poster-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/brands.css">
<script>document.documentElement.className+=' js';</script>
</head>
<body>

<div class="progress" aria-hidden="true"><i></i></div>

<header class="head">
  <img class="watermark" src="img/logo-cream.svg" alt="" aria-hidden="true">
  <div class="wrap">
    <div class="bar">
      <img class="mark" src="img/logo-cream.svg" alt="شعار حيدر" data-in style="--d:40ms;--in-y:-10px">
      <a class="home" href="https://haydarvsky.github.io/" data-in style="--d:120ms;--in-y:-10px">
        الصفحةُ الرئيسة
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
      </a>
    </div>

    <h1 data-in style="--d:220ms">معرضُ الهوياتِ البصرية</h1>
    <p class="sub" data-in style="--d:320ms">أنظمةُ هويةٍ كاملة: الشعارُ ونسخُه، ولوحةُ الألوان، والخطوط، والتطبيقاتُ من الستوري إلى الباكيج.</p>
    <div class="rule"></div>

    <div class="chips" id="chips" role="group" aria-label="تصفيةٌ بالقطاع" data-in style="--d:420ms"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
    <div id="empty" hidden>
      <div class="empty"><b>لا هويةَ في هذا القطاع بعد</b>اختر قطاعاً آخر أو «الكلّ».</div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <a class="back" href="https://haydarvsky.github.io/">
      الصفحةُ الرئيسة
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
    </a>
    <img class="mark" src="img/logo-cream.svg" alt="شعار حيدر">
    <div class="sig">حيدر المعاتيق — أبو إيليا</div>
    <div class="copy">جميعُ الحقوق محفوظة — ٢٠٢٦</div>
  </div>
</footer>

<!-- نافذةُ التفاصيل -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="scrim" data-close></div>
  <div class="box" id="sheetBox">
    <button class="close" type="button" data-close aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="sheetInner"></div>
  </div>
</div>

<script src="js/brands.js"></script>
</body>
</html>
